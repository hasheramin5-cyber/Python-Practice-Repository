[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
version = "0.1.0"
description = "A lightweight Python repository intelligence CLI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Hasher Amin"}
]

[project.scripts]
repolens = "repolens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]